name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install OpenSCAD nightly
        run: |
          curl -fsSL -o openscad.AppImage \
            "$(curl -fsSL https://files.openscad.org/snapshots/ | grep -oE 'OpenSCAD-[0-9.]+-x86_64\.AppImage' | sort -V | tail -1 | sed 's#^#https://files.openscad.org/snapshots/#')"
          chmod +x openscad.AppImage
          ./openscad.AppImage --appimage-extract > /dev/null
          sudo ln -s "$PWD/squashfs-root/AppRun" /usr/local/bin/openscad
          openscad --version
      - run: make check
